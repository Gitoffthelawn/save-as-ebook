<!doctype html>
<html>
<head>
<!-- The extension scripts are loaded before <base> on purpose: <base> is what
     gives the fixture a realistic document.baseURI to resolve image urls
     against, but it would also redirect these relative script paths. -->
<script>
window.chrome = {
  runtime: {onMessage: {addListener: function(){}}, sendMessage: function(){}},
  i18n: {getMessage: function(){ return ''; }}
};
</script>
<script src="../../web-extension/utils.js"></script>
<script src="../../web-extension/sanitizeHtml.js"></script>
<script src="../../web-extension/extractHtml.js"></script>
<base href="https://example.com/blog/">
</head>
<body>

<!-- The shapes a lazy loader actually ships. Reading the src attribute alone
     dropped the first, third and fourth of these and embedded the 1x1 tracking
     gif of the second in place of the photograph. None of the urls resolve -
     the fixture has no network - which is the realistic case: what the read
     phase has to work from is the markup and the browser's own selection, not
     bytes that arrived.

     The width and height attributes are here because a lazy image without them
     lays out at zero and is dropped as invisible long before its source is
     read; a loader that avoids layout shift writes them, and #h is the one
     that does not, so the behaviour is recorded either way. -->
<article>
  <img id="a" data-src="real-photo.jpg" alt="LAZYONE" width="120" height="80">
  <img id="b" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
       data-src="real2.jpg" alt="LAZYTWO" width="120" height="80">
  <img id="c" srcset="only.jpg 1200w" alt="LAZYTHREE" width="120" height="80">
  <img id="d" srcset="wide.jpg 1200w, small.jpg 400w" alt="LAZYFOUR" width="120" height="80">
  <img id="e" src="/img/spacer.gif" data-src="real5.jpg" alt="LAZYFIVE" width="120" height="80">
  <picture>
    <source srcset="picked.jpg 1200w">
    <img id="f" src="fallback.jpg" alt="LAZYSIX" width="120" height="80">
  </picture>
  <!-- A lazily loaded <picture>: the candidates are parked in data-srcset, so
       the browser has nothing to select from and currentSrc is empty. Nothing
       the live page can be asked answers this one - the <source> beside the
       <img> is the whole answer. -->
  <picture>
    <source data-srcset="deferred.jpg 900w">
    <img id="i" alt="LAZYSEVEN" width="120" height="80">
  </picture>
  <img id="g" src="plain.jpg" alt="PLAIN" width="120" height="80">
  <img id="h" data-src="unsized.jpg" alt="UNSIZED">
</article>

<script>
function report(name, ok, detail) {
  var li = document.createElement('li');
  li.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' -- ' + detail : '');
  document.getElementById('results').appendChild(li);
}

function eq(name, actual, expected) {
  report(name, actual === expected,
         actual === expected ? '' : 'got [' + actual + '] wanted [' + expected + ']');
}

window.addEventListener('load', function () {
  var out = document.createElement('ul');
  out.id = 'results';
  document.body.appendChild(out);

  // ---- 1. what a source url alone can say --------------------------------

  eq('a 1x1 gif data uri is a placeholder',
     isPlaceholderImageSrc('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'),
     true);
  eq('a photograph as a data uri is not',
     isPlaceholderImageSrc('data:image/jpeg;base64,' + new Array(900).join('A')), false);
  eq('spacer.gif is a placeholder', isPlaceholderImageSrc('/img/spacer.gif'), true);
  eq('1x1.gif is a placeholder', isPlaceholderImageSrc('https://cdn.example.com/1x1.gif'), true);
  eq('a query string does not hide the name',
     isPlaceholderImageSrc('/img/blank.png?v=3'), true);
  eq('an ordinary photograph is not a placeholder',
     isPlaceholderImageSrc('/img/holder-house.jpg'), false);
  eq('an empty source is a placeholder', isPlaceholderImageSrc(''), true);

  // ---- 2. srcset, when nothing has selected from it ------------------------

  eq('the widest candidate wins',
     pickFromSrcset('a.jpg 400w, b.jpg 1200w, c.jpg 800w'), 'b.jpg');
  eq('the densest candidate wins', pickFromSrcset('a.jpg, b.jpg 2x'), 'b.jpg');
  eq('a bare candidate is 1x', pickFromSrcset('a.jpg'), 'a.jpg');
  eq('an empty srcset names nothing', pickFromSrcset(''), '');
  // one url, commas and all - splitting on every comma handed back the tail of
  // the base64 as if it were a filename
  eq('a data uri is one candidate, not two',
     pickFromSrcset('data:image/gif;base64,R0lGODlhAQABAAAAACw= 1x'),
     'data:image/gif;base64,R0lGODlhAQABAAAAACw=');
  eq('a placeholder in the set loses to the picture beside it',
     pickFromSrcset('/img/blank.gif 1200w, photo.jpg 400w'), 'photo.jpg');

  // ---- 3. the order the sources are tried in -------------------------------

  function candidates(attrs, currentSrc, rendered) {
    return imageSrcCandidates(function (name) { return attrs[name]; },
                              currentSrc || null, !!rendered).join(' ');
  }

  eq('a real src beats a lazy attribute',
     candidates({src: 'photo.jpg', 'data-src': 'other.jpg'}), 'photo.jpg other.jpg');
  eq('a placeholder src loses to the lazy attribute it stands in for',
     candidates({src: '/img/blank.gif', 'data-src': 'photo.jpg'}), 'photo.jpg /img/blank.gif');
  eq('a src that loaded as a 1x1 loses, whatever it is called',
     candidates({src: '/img/hero.png', 'data-src': 'photo.jpg'},
                'https://example.com/img/hero.png', true),
     'photo.jpg /img/hero.png');
  eq('the browser’s own srcset choice beats the fallback in src',
     candidates({src: 'small.jpg', srcset: 'wide.jpg 1200w'},
                'https://example.com/blog/wide.jpg'),
     'https://example.com/blog/wide.jpg small.jpg');
  eq('with no src at all the lazy srcset is read',
     candidates({'data-srcset': 'a.jpg 400w, b.jpg 1200w'}), 'b.jpg');
  eq('nothing to go on names nothing', candidates({}), '');
  // The heuristics above are guesses; shipping the placeholder is what the
  // extension did before, and is still better than dropping the image.
  eq('a placeholder with no alternative is still kept',
     candidates({src: '/img/blank.gif'}), '/img/blank.gif');

  // ---- 4. the real pipeline ------------------------------------------------

  // The article rather than the whole body: the assertions below are still
  // being appended to the results list while this runs.
  var beforeHtml = document.querySelector('article').outerHTML;

  allImages = []; extractedImages = []; imageFileNames.clear();
  classNameToCss.clear(); cssToClassName.clear();

  var state = readLivePage(false, []);
  var clone = document.body.cloneNode(true);
  clearLiveMarks(state);
  var content = getContent(clone, state);

  var queued = allImages.map(function (i) { return i.originalUrl; });
  var queuedNames = queued.map(function (u) { return u.split('/').pop(); }).sort().join(' ');

  function saved(name) {
    return queued.some(function (u) { return u.indexOf('/' + name) > -1; });
  }

  report('an image with only data-src is saved, not dropped',
         saved('real-photo.jpg'), queuedNames);
  report('the photograph replaces the 1x1 placeholder it hides behind',
         saved('real2.jpg') && extractedImages.length === 0,
         'extractedImages=' + extractedImages.length + ' queued=' + queuedNames);
  report('an image with only a srcset is saved',
         saved('only.jpg'), queuedNames);
  report('a multi-candidate srcset resolves to one of its candidates',
         saved('wide.jpg') || saved('small.jpg'), queuedNames);
  report('a src named like a spacer loses to the lazy attribute',
         saved('real5.jpg') && !saved('spacer.gif'), queuedNames);
  report('the <source> the browser picked beats the <img> fallback',
         saved('picked.jpg') && !saved('fallback.jpg'), queuedNames);
  report('a <picture> whose candidates never reached srcset is still saved',
         saved('deferred.jpg'), queuedNames);
  report('an ordinary image is untouched', saved('plain.jpg'), queuedNames);

  // Recorded rather than required: an image the page gave no size to lays out
  // at zero, and the visibility filter drops it before any of this runs.
  report('an unsized lazy image: ' + (saved('unsized.jpg') ? 'saved' : 'dropped as invisible'),
         true, 'clientRects=' + document.getElementById('h').getClientRects().length);

  var refs = content.match(/\.\.\/images\/[^"']+/g) || [];
  report('every image in the content resolves to a file the book will hold',
         refs.length >= 8 && refs.length === new Set(refs).size,
         'refs=' + refs.join(' '));
  // the detail is one line on purpose - the harness reads results line by line
  report('no placeholder data uri reaches the content',
         content.indexOf('data:') < 0, content.replace(/\s+/g, ' ').slice(0, 200));
  // an img tag rather than the whole content: the results list, which the body
  // clone also holds, has the word in its assertion names
  report('no img keeps a srcset', !/<img[^>]*srcset/.test(content),
         content.replace(/\s+/g, ' ').slice(0, 200));

  // ---- 5. the live page is still the page ---------------------------------

  report('live dom unchanged',
         document.querySelector('article').outerHTML === beforeHtml);
  eq('the lazy image still has no src of its own',
     document.getElementById('a').getAttribute('src'), null);
  eq('the placeholder is still the placeholder on the page',
     document.getElementById('e').getAttribute('src'), '/img/spacer.gif');
  report('no marker attributes left behind',
         document.querySelectorAll('[data-sae-mark]').length === 0);

  // ---- 6. content that never had a live element ---------------------------
  //
  // The inside of a same-origin iframe is lifted as markup, and a chapter can
  // be re-sanitized long after the page is gone. Neither has a currentSrc to
  // read, so the attributes have to be enough on their own.

  eq('the string path reads a lazy attribute too',
     sanitizeChapterContent('<img data-src="../images/a.png" alt="x">'),
     '<img src="../images/a.png" alt="x"/>');
  eq('and prefers the real src when there is one',
     sanitizeChapterContent('<img src="../images/a.png" data-src="../images/b.png" alt="x">'),
     '<img src="../images/a.png" alt="x"/>');
  eq('an image with no usable source anywhere is still dropped',
     sanitizeChapterContent('<img data-src="https://example.com/a.png" alt="x">'), '');

  // ---- 7. a <picture> with no live element to ask ------------------------
  //
  // currentSrc is the browser's own answer to which <source> won, and it is the
  // one this path does not have. The sources themselves are still in the markup,
  // and they are where the image is named when the <img> only carries a
  // fallback. resolveImageSrc is the identity here so that the assertions read
  // as "which url won" rather than as archive filenames.

  function pickSrc(html, resolve) {
    var out = parseHTML(html, sanitizeOptions({
      resolveImageSrc: resolve || function (value) { return value; }
    }));
    var found = /<img[^>]*\ssrc="([^"]*)"/.exec(out);
    return found ? found[1] : out;
  }

  eq('a <source> beats the placeholder the <img> falls back to',
     pickSrc('<picture><source srcset="real.jpg 1200w">' +
             '<img src="/img/blank.gif" alt="x"></picture>'), 'real.jpg');
  eq('an <img> with no src of its own is saved by its <source>',
     pickSrc('<picture><source srcset="only.jpg"><img alt="x"></picture>'), 'only.jpg');
  eq('a <source> does not beat a real src',
     pickSrc('<picture><source srcset="other.jpg">' +
             '<img src="photo.jpg" alt="x"></picture>'), 'photo.jpg');
  eq('a lazily parked <source> is read too',
     pickSrc('<picture><source data-srcset="lazy.jpg 800w"><img alt="x"></picture>'),
     'lazy.jpg');
  // The ordinary shape of a <picture> today. Taking the avif because it was
  // written first loses the image at the download stage - the book has no media
  // type for those bytes - while the jpeg beside it would have arrived intact.
  eq('a format the book cannot hold sorts behind one it can',
     pickSrc('<picture><source type="image/avif" srcset="a.avif">' +
             '<source type="image/jpeg" srcset="a.jpg"><img alt="x"></picture>'), 'a.jpg');
  // ...but it is still better than nothing, which is what the image was before.
  eq('an unusable format is still tried when it is all there is',
     pickSrc('<picture><source type="image/avif" srcset="a.avif"><img alt="x"></picture>'),
     'a.avif');
  eq('a <source> rescues an <img> whose own src does not resolve',
     pickSrc('<picture><source srcset="good.jpg"><img src="bad.jpg" alt="x"></picture>',
             function (value) { return value === 'bad.jpg' ? '' : value; }), 'good.jpg');
  eq('the <img>’s own lazy attribute still comes first',
     pickSrc('<picture><source srcset="source.jpg">' +
             '<img data-src="lazy.jpg" alt="x"></picture>'), 'lazy.jpg');
  // An unclosed <picture> is the case that could hand one image's sources to the
  // next one; the list is consumed by the <img> inside it, so it cannot.
  eq('a later image does not inherit the picture it is not in',
     pickSrc('<picture><source srcset="in.jpg"><img alt="a"></picture>' +
             '<img alt="b" data-lazy="b.jpg">'), 'in.jpg');
  eq('and the second image is the one that got b.jpg',
     parseHTML('<picture><source srcset="in.jpg"><img alt="a"></picture>' +
               '<img alt="b" data-lazy="b.jpg">',
               sanitizeOptions({resolveImageSrc: function (v) { return v; }})),
     '<img src="in.jpg" alt="a"/><img src="b.jpg" alt="b"/>');
  // <video>'s sources are not a picture's, and its content is dropped whole
  eq('a <video> source is not mistaken for a picture’s',
     pickSrc('<video><source src="clip.mp4"></video><img alt="x" data-src="after.jpg">'),
     'after.jpg');

  // ---- 8. the same page, captured as a selection --------------------------
  //
  // Reader mode never reaches a selection - the user has already said what the
  // content is - so a selection is the one capture where the plain path is the
  // only path. It is also the one the read phase reaches differently: the clone
  // is a range's contents rather than the body, so the marks have to survive
  // Range.cloneContents().

  allImages = []; extractedImages = []; imageFileNames.clear();
  classNameToCss.clear(); cssToClassName.clear();

  var selection = window.getSelection();
  var range = document.createRange();
  range.selectNodeContents(document.querySelector('article'));
  selection.removeAllRanges();
  selection.addRange(range);

  var selectionState = readLivePage(false, []);
  var fragments = getSelectedNodes();
  clearLiveMarks(selectionState);
  var selected = fragments.map(function (fragment) {
    return getContent(fragment, selectionState);
  }).join('');
  selection.removeAllRanges();

  var selectedUrls = allImages.map(function (i) { return i.originalUrl; }).join(' ');
  function selectedHas(name) { return selectedUrls.indexOf('/' + name) > -1; }

  report('a selected lazy image is saved, not dropped',
         selectedHas('real-photo.jpg'), selectedUrls);
  report('a selected placeholder is replaced by the photograph behind it',
         selectedHas('real2.jpg') && selected.indexOf('data:') < 0, selectedUrls);
  report('a selected srcset-only image is saved',
         selectedHas('only.jpg'), selectedUrls);
  report('the <source> the browser picked wins in a selection too',
         selectedHas('picked.jpg') && !selectedHas('fallback.jpg'), selectedUrls);
  report('a selected lazy <picture> is read from its <source>',
         selectedHas('deferred.jpg'), selectedUrls);
  report('every selected image resolves to a file the book will hold',
         (selected.match(/\.\.\/images\//g) || []).length >= 8,
         selected.replace(/\s+/g, ' ').slice(0, 200));
  report('no marker attributes left behind by the selection',
         document.querySelectorAll('[data-sae-mark]').length === 0);

  document.title = 'DONE';
});
</script>
</body>
</html>
