<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Save as eBook - Chapters</title>
    <link rel="stylesheet" href="chapterEditor.css">
</head>
<body>
    <!-- The editor used to be injected into whatever page was open, which meant
         it inherited that page's styles, scripts and event handlers, and ran with
         the page able to read everything it did. It is an extension page now. -->
    <script src="libs/jszip.js"></script>
    <script src="utils.js"></script>
    <!-- the same sanitizers the content script runs, so that the content and the
         stylesheets this page writes satisfy the invariants the build stage
         relies on -->
    <script src="cssSanitizer.js"></script>
    <script src="sanitizeHtml.js"></script>
    <script src="saveEbook.js"></script>
    <!-- renders one chapter the way the build writes it, for the preview panel -->
    <script src="chapterPreview.js"></script>
    <!-- turns that rendering into the editing surface: removing elements and
         editing text happen in the frame, and everything that comes back out of
         it goes through the sanitizer above before it is stored -->
    <script src="chapterContentEditor.js"></script>
    <script src="chapterEditor.js"></script>
</body>
</html>
